<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和田研フォント — 和田研・原典骨格から生成</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="data:,"></head><body>
<header><button id="info" aria-label="ライセンスを表示">ⓘ</button><div class="common-row"><label class="common">全てに試打<input id="common" value="し文田の" autocomplete="off" spellcheck="false"></label><button id="paste-all" aria-label="クリップボードの全文で置き換え">貼り付け</button></div><button id="replay-all">全て再生</button><label class="speed">確認速度<select id="speed"><option value="1">1×</option><option value=".75">0.75×</option><option value=".5">0.5×</option><option value=".25">0.25×</option><option value="2">2×</option></select></label></header>
<div class="controls"><label>文字サイズ <input id="letter-size" type="range" min="32" max="180" step="4" value="80"><output id="letter-size-value">80</output></label><label><input id="guides" type="checkbox"> 判断点（青）</label><label><input id="manual" type="checkbox"> 静止比較</label><label>畳み量 <input id="fold" type="range" min="0" max="1" step=".01" value=".65"></label><span>0＝完成形 ／ 1＝開始形</span></div><p id="status" role="status">原典の文字定義と生成処理を読み込み中…</p><main id="patterns"></main>
<dialog id="license"><button id="close" aria-label="閉じる">×</button><h1>ライセンス</h1><pre id="license-text"></pre></dialog><script type="module" src="/app.js"></script></body></html>
