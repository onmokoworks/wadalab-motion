<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <title>和田研フォント</title>
 <link rel="stylesheet" href="/style.css">
 <link rel="icon" href="data:,">
</head>
<body>
 <main id="stage">
  <canvas id="canvas" aria-label="入力した文字"></canvas>
 </main>
 <textarea id="input" aria-label="文字を入力" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></textarea>
 <span id="caret" aria-hidden="true"></span>
 <button id="info" aria-label="ライセンスを表示">ⓘ</button>
 <button id="paste" aria-label="クリップボードの全文で置き換え">貼り付け</button>
 <p id="error" role="status"></p>
 <dialog id="license">
  <button id="close" aria-label="閉じる">×</button>
  <h1>ライセンス</h1>
  <pre id="license-text"></pre>
 </dialog>
 <script type="module" src="/app.js"></script>
</body>
</html>
