<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wadamotion-1 — TEST</title><link rel="icon" href="data:,">
<style>html,body{margin:0;width:100%;min-height:100%;background:#fff;overflow-x:hidden;color:#111}svg{display:block;width:100%;height:100%}path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}a{position:absolute;top:18px;left:20px;color:#999;text-decoration:none;font:14px monospace}#error{position:absolute;bottom:20px;left:20px;font:14px monospace}</style>
<a href="/workspace/" aria-label="workspaceへ戻る">←</a><svg role="img" aria-label="TEST、onmk.work、MOTION、Wadalab fontの下にThe quick brown fox jumps over the lazy dogを単語ごとに並べた歩行アニメーション"></svg><p id="error" role="status"></p>
<script type="module">
import {createMotionLibrary} from '/motion-library.js';
import {walkingPoint,leadingWeights,coast,crossRig} from '/walk-core.js';
const svg=document.querySelector('svg');
svg.style.touchAction='pan-y';svg.style.cursor='grab';
let manualOffset=0,velocity=0,drag=null,driftOffset=0,lastFrame=performance.now();
svg.addEventListener('pointerdown',event=>{if(event.button!==0)return;svg.setPointerCapture(event.pointerId);drag={id:event.pointerId,x:event.clientX,time:performance.now()};velocity=0;svg.style.cursor='grabbing';});
svg.addEventListener('pointermove',event=>{
 if(!drag||event.pointerId!==drag.id)return;
 const now=performance.now(),dx=event.clientX-drag.x,dt=(now-drag.time)/1000;
 manualOffset+=dx;if(dt>0)velocity=velocity*.3+Math.max(-2400,Math.min(2400,dx/dt))*.7;
 drag={id:drag.id,x:event.clientX,time:now};
});
function release(event){if(!drag||event.pointerId!==drag.id)return;if(performance.now()-drag.time>100)velocity=0;drag=null;svg.style.cursor='grab';}
svg.addEventListener('pointerup',release);svg.addEventListener('pointercancel',event=>{velocity=0;release(event);});
try{
 const names={program:'source-program.json',glyphs:'source-glyphs.json',ascii:'font/ascii-outlines.json',alpha:'font/alpha-centerlines.json'};
 const data=Object.fromEntries(await Promise.all(Object.entries(names).map(async([name,path])=>{const response=await fetch(new URL(path,new URL('/motion-library.js',location.href)));if(!response.ok)throw new Error(response.status);return [name,await response.json()];})));
 const library=createMotionLibrary(data),rows=[],compact=new URLSearchParams(location.search).get('spacing')==='compact';
 for(const [text,multiplier,speed,linearSpeed] of [['TEST',1,1],['onmk.work',.5,2],['MOTION',1,1],['Wadalab font',2,1],['The quick brown fox jumps over the lazy dog',.25,3,2],['The',2,1],['quick',.5,3],['brown',1.35,.8],['fox',.75,1.8],['jumps',1.15,1.4],['over',.65,2],['the',1,.75],['lazy',1.5,.6],['dog',.9,1.6]]){
  const strokes=[],smallText=multiplier<=.25;let advance=0,index=0;
  for(const character of text){
   if(character===' '){advance+=smallText?340:compact?100:220;index++;continue;}
   const frame=library.sample(character,1);if(frame.kind!=='paths')throw new Error('文字の線データがありません');
   frame.strokes=frame.strokes.map(stroke=>stroke.points?stroke:{...stroke,points:Array.from({length:25},(_,i)=>({x:stroke.center.x+Math.cos(i/24*Math.PI*2)*stroke.radiusX,y:stroke.center.y+Math.sin(i/24*Math.PI*2)*stroke.radiusY}))});
   const xs=frame.strokes.flatMap(stroke=>stroke.points.map(p=>p.x)),minimum=Math.min(...xs);
   const cross='xX'.includes(character)?crossRig(frame.strokes):null;
   const weights=cross?cross.weights:leadingWeights(frame.strokes,'MWw'.includes(character)?{originX:(Math.min(...xs)+Math.max(...xs))/2}:{});
   if(cross)frame.strokes=cross.strokes;
   frame.strokes.forEach((stroke,s)=>strokes.push({weights:weights[s],delay:(text.length-1-index)*.18,points:stroke.points.map(p=>({x:p.x-minimum+advance,y:p.y}))}));advance+=Math.max(frame.advance,Math.max(...xs)-minimum+(smallText?240:80));index++;
  }
  const points=strokes.flatMap(s=>s.points);
  rows.push({text,multiplier,speed,linearSpeed:linearSpeed??Math.max(1,1/multiplier),strokes,left:Math.min(...points.map(p=>p.x)),right:Math.max(...points.map(p=>p.x)),top:Math.min(...points.map(p=>p.y)),bottom:Math.max(...points.map(p=>p.y))});
 }
 const started=performance.now();let size;
 function resize(){
  const width=innerWidth,scale=Math.min(width/2400,innerHeight/2600),lineWidth=Math.max(1.4,Math.min(3,width/450));
  const gap=4,totalHeight=rows.reduce((sum,row)=>sum+(row.bottom-row.top)*scale*row.multiplier,0)+gap*(rows.length-1),height=Math.max(innerHeight,totalHeight+90);let y=(height-totalHeight)/2;
  size={width,height,scale};svg.style.height=`${height}px`;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.replaceChildren();
  for(const row of rows){
   const rowHeight=(row.bottom-row.top)*scale*row.multiplier;row.centerY=y+rowHeight/2;y+=rowHeight+gap;
   const rowScale=scale*row.multiplier;
   row.period=(row.right-row.left+Math.max(...row.strokes.map(stroke=>stroke.delay))*200+440)*rowScale;
   row.copies=Array.from({length:Math.ceil(width/row.period)+3},()=>row.strokes.map(stroke=>{const node=document.createElementNS('http://www.w3.org/2000/svg','path');node.setAttribute('stroke-width',lineWidth);svg.append(node);return node;}));
  }
 }
 resize();addEventListener('resize',resize);
 function draw(now){
  const {width,height,scale}=size,elapsed=(now-started)/520,step=200,dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;
  if(!drag){const motion=coast(velocity,dt);manualOffset+=motion.distance;velocity=motion.velocity;driftOffset+=dt*width*.02;}
  rows.forEach((row,r)=>{
   const drift=driftOffset*row.linearSpeed+manualOffset;
   const time=elapsed*row.speed,cycle=Math.floor(time),rowScale=scale*row.multiplier,offset=((cycle*step*rowScale+drift)%row.period+row.period)%row.period,centerY=row.centerY;
   row.strokes.forEach((stroke,s)=>{
    const path=stroke.points.map((point,i)=>walkingPoint(point,{lead:stroke.weights[i],step,time:Math.max(0,time-stroke.delay)}));
    row.copies.forEach((nodes,copy)=>nodes[s].setAttribute('d',path.map((p,i)=>`${i?'L':'M'}${(p.x-row.left-cycle*step)*rowScale+offset+(copy-1)*row.period},${centerY+(p.y-(row.top+row.bottom)/2)*rowScale}`).join(' ')));
   });
  });requestAnimationFrame(draw);
 }requestAnimationFrame(draw);
}catch(reason){document.querySelector('#error').textContent=`読み込みに失敗しました：${reason.message}`;}
</script></html>
