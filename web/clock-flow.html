<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Clock — wadalab-motion</title><link rel="icon" href="data:,">
<style>html,body{margin:0;background:#fff;color:#111;overflow-x:hidden}svg{display:block;width:100%;touch-action:pan-y}path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}a{position:absolute;top:18px;left:20px;color:#999;text-decoration:none;font:14px monospace}#error{font:14px monospace}</style>
<a href="/workspace/" aria-label="workspaceへ戻る">←</a><svg role="timer" aria-live="off"></svg><p id="error"></p>
<script type="module">


import {coast} from '/walk-core.js';
import {formatClock,transitionProgress} from '/clock-core.js';
import {clockGlyphFrame,clockLayers} from '/clock-flow-core.js';
const svg=document.querySelector('svg'),NS='http://www.w3.org/2000/svg';
let drag=null,manualOffset=0,velocity=0,lastFrame=performance.now(),distance=0;
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;svg.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,time:performance.now()};velocity=0;});
svg.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const now=performance.now(),dx=e.clientX-drag.x,dt=(now-drag.time)/1000;manualOffset+=dx;if(dt>0)velocity=.3*velocity+.7*Math.max(-2400,Math.min(2400,dx/dt));drag={id:e.pointerId,x:e.clientX,time:now};});
svg.addEventListener('pointerup',()=>{if(drag&&performance.now()-drag.time>100)velocity=0;drag=null;});svg.addEventListener('pointercancel',()=>{drag=null;velocity=0;});
try{
 const response=await fetch('/font/clock-skeletons.json');if(!response.ok)throw Error(response.status);const data=await response.json();
 const glyphs=new Map(data.glyphs.map(([character,paths,width,advance])=>[character,{character,paths,width,advance}]));
 const initial=formatClock(new Date()).ascii,slots=[...initial].map(character=>({character,current:glyphs.get(character),previous:null,started:performance.now()/1000}));
 const rowSizes=[.45,1.1,.65,2,.3,1.5,.8,.4,1.8,.6,1,.35,1.3],rows=rowSizes.map((size,i)=>({size,phase:i*.19,speed:Math.max(1,1/size)}));
 let current=initial,width,scale;
 function resize(){width=innerWidth;scale=Math.min(width/1900,innerHeight/3100);const total=rows.reduce((sum,row)=>sum+400*scale*row.size+4,0),height=Math.max(innerHeight,total+70);svg.style.height=`${height}px`;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.replaceChildren();let y=(height-total)/2;
  for(const row of rows){row.scale=scale*row.size;row.y=y;y+=400*row.scale+4;row.period=1780*row.scale;row.copies=Array.from({length:Math.ceil(width/row.period)+3},()=>Array.from({length:8},()=>{const g=document.createElementNS(NS,'g');svg.append(g);return g;}));}
 }
 resize();addEventListener('resize',resize);
 function draw(now){
  const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;
  if(!drag){const m=coast(velocity,dt);manualOffset+=m.distance;velocity=m.velocity;distance+=dt*width*.025;}
  const time=formatClock(new Date()).ascii;if(time!==current){current=time;[...time].forEach((ch,i)=>{const slot=slots[i];if(slot.character===ch)return;slot.previous=slot.current;slot.current=glyphs.get(ch);slot.character=ch;slot.started=now/1000;});svg.setAttribute('aria-label',current);}
  const frames=slots.map(slot=>{const progress=transitionProgress(now/1000,slot.started);const layers=clockLayers(slot.current,slot.previous,progress).map(layer=>layer.visible?clockGlyphFrame(layer.glyph,layer.amount):null);if(progress>=1)slot.previous=null;return layers;});
  for(const row of rows){const offset=((distance*row.speed+manualOffset+row.phase*row.period)%row.period+row.period)%row.period;
   row.copies.forEach((holders,copy)=>holders.forEach((holder,i)=>{
    while(holder.children.length<2)holder.append(document.createElementNS(NS,'g'));
    frames[i].forEach((frame,l)=>{const group=holder.children[l];group.setAttribute('visibility',frame?'visible':'hidden');if(!frame)return;group.setAttribute('opacity',frame.opacity);
     while(group.children.length<frame.paths.length){const node=document.createElementNS(NS,'path');node.setAttribute('stroke-width',Math.max(1.3,Math.min(2.8,width/500)));group.append(node);}
     for(let s=0;s<group.children.length;s++){const path=frame.paths[s];group.children[s].setAttribute('d',path?.length>1?path.map((p,j)=>`${j?'L':'M'}${(p.x+frame.offset+i*200)*row.scale+offset+(copy-1)*row.period},${p.y*row.scale+row.y}`).join(' '):'');}
    });
   }));
  }requestAnimationFrame(draw);
 }svg.setAttribute('aria-label',current);requestAnimationFrame(draw);
}catch(e){document.querySelector('#error').textContent=`読み込みに失敗しました：${e.message}`;}
</script></html>
